[project]
name = "clock-backend"
version = "0.1.0"
description = ""
authors = [{ name = "Christian Grossmüller", email = "chgad.games@gmail.com" }, {name = "Sören Grieger", email = "soeren.grieger@posteo.de" },
    { name = "Michael Gecht", email = "<gecht.m@gmail.com>" }]
requires-python ="^3.14"

[tool.poetry.dependencies]
python = "^3.14"
gunicorn = "==22.0.0"
